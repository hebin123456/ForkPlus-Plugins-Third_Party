# ForkPlus-Plugins-Third_Party · 三方件六平台构建与发布
#
# 触发：
#   - push 版本 tag（`0.0.1` / `v0.0.1`）：六平台构建 → 汇总 → 创建 GitHub Release
#   - workflow_dispatch：只构建 + 上传 Artifacts（不发 Release）
#
# 六平台与 ForkPlus 宿主一致：
#   win-x64     → windows-latest    （MSYS2 MINGW64 工具链）
#   win-arm64   → windows-11-arm    （镜像自带 MSYS2 的 CLANGARM64 工具链，原生 ARM64）
#   linux-x64   → ubuntu-latest
#   linux-arm64 → ubuntu-22.04-arm  （原生 ARM64 runner，公开仓库免费）
#   osx-arm64   → macos-latest
#   osx-x64     → macos-latest      （arm64 runner 上 -arch x86_64 交叉编译，不依赖容量小
#                                  且已进退役流程的 Intel runner macos-13）
#
# 「组件 × RID」由 scripts/matrix.py 扫描 <component>/manifest.json 自动展开：
# 新增一个三方件只需建目录 + 写 manifest.json + build.sh，**不用改本文件**。
#
# 交付件：<component>-<rid>.zip（稳定名，平铺运行期库 + 许可全文 + component.json）。
# Release 另附 index.json，登记每个交付件的 sha256 / 大小 / 运行期库名——插件仓据此
# 校验下载，因此可以「不锁版本、自动消费最新 tag」。index.json 的格式属对外接口。

name: build

on:
  push:
    tags:
      - 'v[0-9]*'
      - '[0-9]*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 展开构建矩阵 + 解析版本号。轻量、先行，供后续 job 复用。
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enumerate components
        id: matrix
        run: python3 scripts/matrix.py >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version: $version (from tag ${tag})"

  build:
    name: ${{ matrix.component }} · ${{ matrix.rid }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows x64：FFmpeg 的 configure / make 是 bash 脚本，走 MSYS2 的 MINGW64 环境。
      # x86_64 的汇编需要 nasm；python 供 build.sh / pack.py 解析 manifest 与打包。
      - name: Setup MSYS2 (Windows x64 · MINGW64)
        if: matrix.rid == 'win-x64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            make
            nasm
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-python

      # Windows ARM64：windows-11-arm 镜像自带 MSYS2（C:\msys64，未加入 PATH）。
      # setup-msys2 只发布 x86_64 安装包（在 ARM64 上行为异常），故直接用镜像自带的
      # MSYS2 装 CLANGARM64 工具链：原生 aarch64-w64-windows-gnu 的 clang，
      # zlib 与 python 与 x64 腿保持同一份能力。aarch64 无 x86 汇编需求，不需要 nasm；
      # make 必须用 **msys** 版（/usr/bin/make，MSYS 运行时会给原生命令转换 POSIX 路径；
      # clangarm64 工具链里的 mingw32-make 不做转换，FFmpeg 的 configure/make 依赖前者）；
      # git 用 PATH 上 Git for Windows 的（不装 msys 版，避免顺手升级 MSYS2 运行时）。
      - name: Setup MSYS2 packages (Windows ARM64 · CLANGARM64)
        if: matrix.rid == 'win-arm64'
        shell: bash
        run: |
          set -e
          MSYSTEM=CLANGARM64 /c/msys64/usr/bin/bash.exe -lc '
            pkgs="make git mingw-w64-clang-aarch64-toolchain mingw-w64-clang-aarch64-zlib mingw-w64-clang-aarch64-python"
            # 镜像偶发慢速/断流（实测 ftp2.osuosl.org 低于 1B/s 会让 pacman 整笔事务失败）：
            # 最多重试 3 次，已下载的包在 pacman 缓存里，重试只补缺。
            for attempt in 1 2 3; do
              if pacman -Sy --needed --noconfirm --noprogressbar $pkgs; then
                exit 0
              fi
              echo "::warning::pacman 安装失败（第 ${attempt} 次），15s 后重试"
              sleep 15
            done
            exit 1
          '

      # build.sh / pack.py 用 python3 解析 manifest 与打包（Windows 的 MSYS2 里另装了
      # mingw / clangarm64 python；这里显式保证 Linux / macOS 上一定有 python3）。
      - name: Setup Python
        if: runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Linux 的 gcc / make 由 runner 自带；x86_64 的汇编需要 nasm（arm64 不用装）。
      - name: Install nasm (Linux x64)
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm

      # macOS 镜像不含 nasm：osx-x64 的 x86_64 汇编同样需要（osx-arm64 不用）。arm64 上装的
      # nasm 本体也是 arm64 二进制，但其 -f macho64 输出与宿主架构无关，交叉照用。
      - name: Install nasm (macOS x64)
        if: matrix.rid == 'osx-x64'
        run: brew install nasm

      - name: Build (Windows x64 · MSYS2 MINGW64)
        if: matrix.rid == 'win-x64'
        shell: msys2 {0}
        run: bash ${{ matrix.component }}/build.sh ${{ matrix.rid }} dist

      # 镜像自带的 MSYS2（C:\msys64）未进 PATH，显式经它的 bash 进入 CLANGARM64 环境。
      # 注意：/etc/profile 会把工作目录切到 $HOME（实测 CHERE_INVOKING 在该镜像上不生效），
      # 这里用 cygpath 把工作区转成 MSYS 路径后显式 cd，再执行 build.sh。
      - name: Build (Windows ARM64 · MSYS2 CLANGARM64)
        if: matrix.rid == 'win-arm64'
        shell: bash
        run: |
          set -e
          workdir="$(cygpath -u "$GITHUB_WORKSPACE")"
          MSYSTEM=CLANGARM64 /c/msys64/usr/bin/bash.exe -lc \
            "cd '$workdir' && bash ${{ matrix.component }}/build.sh ${{ matrix.rid }} dist"

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ${{ matrix.component }}/build.sh ${{ matrix.rid }} dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # 仅 tag 触发：六平台全绿后汇总交付件并创建 Release。
  # 只需部分平台成功即可发版（fail-fast: false），但 Release 汇总用的是实际产出的那几个。
  release:
    name: Release
    needs: [plan, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 拉平后一并发布：交付件放 Release 根目录，插件仓才能按
      # releases/latest/download/<asset> 直接取；index.json 同理。
      - name: Assemble index.json
        run: |
          set -e
          mkdir -p release-assets
          find artifacts -name '*.zip' -exec cp {} release-assets/ \;
          python3 scripts/index.py artifacts release-assets/index.json \
            --body release-notes.md \
            --tag "${{ needs.plan.outputs.version }}"
          echo "--- release assets ---"
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: release-notes.md
